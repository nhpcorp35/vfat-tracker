<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vfat Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230f1318'/><text y='24' x='4' font-size='22' fill='%232dcd7a'>&#9670;</text></svg>">
<style>
  :root {
    --bg: #0a0d12; --surface: #0f1318; --border: #1d2330; --border2: #2a3142;
    --text: #e8ecf1; --muted: #7a8899; --green: #2dcd7a; --green-dim: rgba(45,205,122,0.12);
    --red: #f4545c; --red-dim: rgba(244,84,92,0.12); --amber: #e8a33d; --blue: #4a9eff;
    --mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--mono); margin: 0; padding: 24px; }
  .header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .title { font-size: 20px; font-weight: 600; }
  .subtitle { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .hub-link { display: inline-block; color: var(--muted); font-size: 12px; text-decoration: none; margin-bottom: 6px; }
  .hub-link:hover { color: var(--blue); }
  #wallet-input { background: var(--surface); border: 1px solid var(--border2); color: var(--text); font-family: var(--mono); font-size: 12px; padding: 6px 10px; border-radius: 6px; width: 340px; max-width: 60vw; }
  .btn { background: var(--blue); color: #fff; border: none; font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
  .error-banner { background: var(--red-dim); border: 1px solid rgba(244,84,92,0.25); border-radius: 8px; padding: 12px 16px; font-size: 12px; color: var(--red); margin-bottom: 20px; display: none; }
  .portfolio-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }
  .portfolio-stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .portfolio-stat-value { font-size: 20px; font-weight: 600; }
  .portfolio-stat-value.accent { color: var(--blue); }
  .portfolio-stat-value.warn { color: var(--amber); }
  .positions { display: flex; flex-direction: column; gap: 16px; }
  .position-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
  .position-card.in-range { border-left: 3px solid var(--green); }
  .position-card.out-range { border-left: 3px solid var(--red); }
  .pos-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  .pos-title { font-size: 16px; font-weight: 600; }
  .pos-title .fee-tag { font-size: 11px; color: var(--muted); background: var(--border); padding: 2px 8px; border-radius: 4px; margin-left: 8px; }
  .pos-title .id-tag { font-size: 11px; color: var(--muted); margin-left: 6px; }
  .pos-title .protocol-tag { font-size: 10px; color: var(--blue); background: rgba(74,158,255,0.12); padding: 2px 8px; border-radius: 4px; margin-left: 8px; text-transform: uppercase; letter-spacing: 0.03em; }
  .pos-title .chain-tag { font-size: 10px; color: var(--green); background: rgba(45,205,122,0.12); padding: 2px 8px; border-radius: 4px; margin-left: 6px; text-transform: uppercase; letter-spacing: 0.03em; }
  .range-badge { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 6px; letter-spacing: 0.05em; }
  .range-badge.in { background: var(--green-dim); color: var(--green); }
  .range-badge.out { background: var(--red-dim); color: var(--red); }
  .range-bar-block { margin: 14px 0; }
  .range-bar-header { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .range-bar-header .width-val { color: var(--text); }
  .range-bar-track { position: relative; height: 8px; background: var(--border); border-radius: 4px; margin: 4px 0;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.15) 0, rgba(255,255,255,0.15) 1px, transparent 1px, transparent calc(100% / 24));
  }
  .range-bar-fill { position: absolute; top: 0; height: 100%; border-radius: 4px; background: var(--green-dim); border: 1px solid rgba(45,205,122,0.4); }
  .position-card.out-range .range-bar-fill { background: rgba(244,84,92,0.14); border-color: rgba(244,84,92,0.45); }
  .range-bar-marker { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--blue); transform: translateX(-1px); }
  .range-bar-labels { display: flex; justify-content: space-between; font-size: 11px; margin-top: 6px; }
  .range-bar-edge .edge-price { color: var(--text); }
  .range-bar-edge .edge-away { color: var(--amber); }
  .range-bar-current { color: var(--blue); text-align: center; }
  .pos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 12px; }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .stat-value { font-size: 15px; font-weight: 600; }
  .stat-value.dim { color: var(--muted); font-weight: 400; }
  .fees-row { display: flex; align-items: center; justify-content: space-between; background: rgba(32,210,200,0.10); border: 1px solid rgba(32,210,208,0.25); border-radius: 8px; padding: 10px 14px; font-size: 12px; flex-wrap: wrap; gap: 8px; }
  .rewards-row { background: rgba(232,163,61,0.10); border: 1px solid rgba(232,163,61,0.3); margin-top: 8px; }
  .rewards-row .fees-value { color: var(--amber); }
  .fees-label { color: var(--muted); }
  .fees-value { color: #20d2d0; }
  .empty-state { text-align: center; padding: 60px 0; color: var(--muted); font-size: 13px; }
  .pnl-pos { color: var(--green); }
  .pnl-neg { color: var(--red); }
  .pnl-sub { font-family: var(--mono); font-size: 12px; margin-top: 2px; }
  a { color: var(--blue); }
  .pos-history-toggle { cursor: pointer; color: var(--blue); font-size: 12px; margin-top: 14px; user-select: none; }
  .pos-history-panel { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .pos-history-subheader { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 14px 0 6px; }
  .range-btns { display: flex; gap: 6px; margin-bottom: 8px; }
  .range-btn { font-size: 11px; color: var(--muted); background: transparent; border: 1px solid var(--border2); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-family: var(--mono); }
  .range-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  .history-chart-wrap { position: relative; }
  .history-empty { font-size: 12px; color: var(--muted); text-align: center; padding: 30px 0; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
  <div class="header">
    <div>
      <a href="https://v4.lptracker.info" class="hub-link">← Hub</a>
      <div class="title">◈ vfat Tracker</div>
      <div class="subtitle">Uniswap V3 positions held via your Sickle · Base</div>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <input id="wallet-input" placeholder="Wallet 0x..." />
      <button class="btn" onclick="loadPositions(true)">Load</button>
    </div>
  </div>

  <div class="error-banner" id="error-banner"></div>
  <div id="portfolio"></div>
  <div class="positions" id="positions"></div>

<script>
function fmtUsd(n) {
  if (n === null || n === undefined) return null;
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtPct(n, decimals) {
  if (n === null || n === undefined) return '—';
  return Number(n).toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + '%';
}
function fmtNum(n, decimals) {
  if (n === null || n === undefined) return '—';
  return Number(n).toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function fmtPrice(n) {
  if (n === null || n === undefined) return '—';
  const decimals = n >= 100 ? 0 : n >= 1 ? 2 : 6;
  return '$' + Number(n).toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function fmtPnl(usd, pct) {
  if (usd === null || usd === undefined) return null;
  const cls = usd >= 0 ? 'pnl-pos' : 'pnl-neg';
  const sign = usd >= 0 ? '+' : '-';
  const usdStr = sign + '$' + Math.abs(usd).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const pctStr = (pct !== null && pct !== undefined) ? ` (${sign}${Math.abs(pct).toFixed(2)}%)` : '';
  return { cls, text: usdStr + pctStr };
}
function feeTierLabel(feeRaw) {
  return (feeRaw / 10000).toFixed(2) + '%';
}

function renderRangeBar(p) {
  const lo = p.price_lower, hi = p.price_upper, cur = p.current_price;
  if (lo === null || hi === null || cur === null || hi <= lo) return '';

  const span = hi - lo;
  const pad = span * 0.15;
  const rangeMin = lo - pad, rangeMax = hi + pad;
  const pct = (v) => ((v - rangeMin) / (rangeMax - rangeMin)) * 100;
  const fillLeft = pct(lo);
  const fillWidth = pct(hi) - pct(lo);
  const markerLeft = Math.min(100, Math.max(0, pct(cur)));

  // A negative "% away" means the price is already past that edge, not
  // approaching it — label it as such rather than showing a bare negative.
  const edgeLabel = (v) => {
    if (v === null || v === undefined) return '';
    return v >= 0 ? `${v.toFixed(1)}% away` : `${Math.abs(v).toFixed(1)}% past`;
  };

  return `
    <div class="range-bar-block">
      <div class="range-bar-header">
        <span>Price Range</span>
        <span class="width-val">Width ${fmtPct(p.range_width_pct, 1)}</span>
      </div>
      <div class="range-bar-track">
        <div class="range-bar-fill" style="left:${fillLeft}%; width:${fillWidth}%;"></div>
        <div class="range-bar-marker" style="left:${markerLeft}%;" title="Current price"></div>
      </div>
      <div class="range-bar-labels">
        <div class="range-bar-edge"><div class="edge-price">${fmtPrice(lo)}</div><div class="edge-away">${edgeLabel(p.pct_from_lower)}</div></div>
        <div class="range-bar-current">▲ ${fmtPrice(cur)}</div>
        <div class="range-bar-edge" style="text-align:right;"><div class="edge-price">${fmtPrice(hi)}</div><div class="edge-away">${edgeLabel(p.pct_from_upper)}</div></div>
      </div>
    </div>
  `;
}

function renderPortfolio(portfolio, sickleAddresses, note) {
  const el = document.getElementById('portfolio');
  if (note) {
    el.innerHTML = `<div class="empty-state">${note}</div>`;
    return;
  }
  if (!portfolio || portfolio.position_count === 0) {
    el.innerHTML = `<div class="empty-state">No open positions found across any tracked chain.</div>`;
    return;
  }
  const totalValue = fmtUsd(portfolio.total_value_usd) || '—';
  const totalFees = fmtUsd(portfolio.total_fees_usd) || '—';
  const oorNote = portfolio.out_of_range_count > 0
    ? `<div class="portfolio-stat-value warn">${portfolio.out_of_range_count} / ${portfolio.position_count}</div>`
    : `<div class="portfolio-stat-value">0 / ${portfolio.position_count}</div>`;
  const pnl = fmtPnl(portfolio.total_pnl_usd, null);
  const pnlBlock = pnl ? `<div class="portfolio-stat-value ${pnl.cls}">${pnl.text}</div>` : `<div class="portfolio-stat-value" style="color:var(--muted);">—</div>`;

  const sickleLines = Object.entries(sickleAddresses || {})
    .filter(([, addr]) => addr)
    .map(([chain, addr]) => `<div>${chain}: ${addr.slice(0,6)}...${addr.slice(-4)}</div>`)
    .join('');

  el.innerHTML = `
    <div class="portfolio-bar">
      <div><div class="portfolio-stat-label">Total Value</div><div class="portfolio-stat-value accent">${totalValue}</div></div>
      <div><div class="portfolio-stat-label">Uncollected Fees</div><div class="portfolio-stat-value">${totalFees}</div></div>
      <div><div class="portfolio-stat-label">P&L (since tracked)</div>${pnlBlock}</div>
      <div><div class="portfolio-stat-label">Out of Range</div>${oorNote}</div>
      <div><div class="portfolio-stat-label">Sickles</div><div class="portfolio-stat-value" style="font-size:11px; line-height:1.6;">${sickleLines || '—'}</div></div>
    </div>
  `;
}

function renderPositions(positions) {
  const el = document.getElementById('positions');
  if (!positions.length) { el.innerHTML = ''; return; }

  el.innerHTML = positions.map(p => {
    const sym0 = p.token0.symbol, sym1 = p.token1.symbol;
    const rangeClass = p.in_range ? 'in-range' : 'out-range';
    const badgeClass = p.in_range ? 'in' : 'out';
    const badgeText = p.in_range ? 'In Range' : 'Out of Range';
    const holdingsLine = `${fmtNum(p.amount0, 6)} ${sym0} + ${fmtNum(p.amount1, 6)} ${sym1}`;
    const usdValue = fmtUsd(p.position_value_usd);
    const feesUsd = fmtUsd(p.uncollected_fees_usd);
    const pnl = fmtPnl(p.pnl_usd, p.pnl_pct);
    const pnlLine = pnl ? `<div class="pnl-sub ${pnl.cls}">${pnl.text}</div>` : '';
    const aprLine = (p.apr_pct === null || p.apr_pct === undefined) ? '—' : fmtPct(p.apr_pct, 1);
    const estAprLine = (p.estimated_apr_pct === null || p.estimated_apr_pct === undefined) ? '—' : fmtPct(p.estimated_apr_pct, 1);
    const rewardsRow = p.is_staked
      ? `<div class="fees-row rewards-row">
           <span class="fees-label">Pending ${p.reward_token_symbol || 'Reward'}</span>
           <span class="fees-value">${p.pending_reward !== null && p.pending_reward !== undefined ? fmtNum(p.pending_reward, 6) + ' ' + (p.reward_token_symbol || '') : '—'}${p.pending_reward_usd ? ' (' + fmtUsd(p.pending_reward_usd) + ')' : ''}</span>
         </div>`
      : '';
    const posKey = `${p.chain}-${p.protocol}-${p.token_id}`;

    return `
      <div class="position-card ${rangeClass}">
        <div class="pos-header">
          <div class="pos-title">${sym0} / ${sym1}<span class="fee-tag">${feeTierLabel(p.fee_tier)}</span><span class="id-tag">#${p.token_id}</span><span class="protocol-tag">${p.protocol_label}</span><span class="chain-tag">${p.chain_label}</span></div>
          <span class="range-badge ${badgeClass}">${badgeText}</span>
        </div>
        ${renderRangeBar(p)}
        <div class="pos-grid">
          <div>
            <div class="stat-label">Current Holdings</div>
            <div class="stat-value">${holdingsLine}</div>
            ${usdValue ? `<div class="stat-value" style="margin-top:2px;">${usdValue}</div>` : ''}
            ${pnlLine}
          </div>
          <div>
            <div class="stat-label">Range Width</div>
            <div class="stat-value">${fmtPct(p.range_width_pct, 1)}</div>
            <div class="stat-value dim" style="margin-top:2px;">[${p.tick_lower}, ${p.tick_upper}]</div>
          </div>
          <div>
            <div class="stat-label">Est. APR (pool activity)</div>
            <div class="stat-value">${estAprLine}</div>
          </div>
          <div>
            <div class="stat-label">APR (since tracked)</div>
            <div class="stat-value">${aprLine}</div>
          </div>
        </div>
        <div class="fees-row">
          <span class="fees-label">Uncollected Fees</span>
          <span class="fees-value">${fmtNum(p.uncollected_fees0, 6)} ${sym0} / ${fmtNum(p.uncollected_fees1, 6)} ${sym1}${feesUsd ? ' (' + feesUsd + ')' : ''}</span>
        </div>
        ${rewardsRow}

        <div class="pos-history-toggle" onclick="togglePositionHistory('${p.chain}', '${p.protocol}', ${p.token_id})">
          <span id="pos-history-arrow-${posKey}">▸</span> Position History
        </div>
        <div class="pos-history-panel" id="pos-history-panel-${posKey}" style="display:none;">
          <div class="range-btns" id="pos-history-btns-${posKey}">
            <button class="range-btn" onclick="setPositionHistoryRange('${p.chain}', '${p.protocol}', ${p.token_id}, '7d', this)">7D</button>
            <button class="range-btn active" onclick="setPositionHistoryRange('${p.chain}', '${p.protocol}', ${p.token_id}, '30d', this)">30D</button>
            <button class="range-btn" onclick="setPositionHistoryRange('${p.chain}', '${p.protocol}', ${p.token_id}, '90d', this)">90D</button>
            <button class="range-btn" onclick="setPositionHistoryRange('${p.chain}', '${p.protocol}', ${p.token_id}, 'all', this)">All</button>
          </div>
          <div class="history-chart-wrap" style="height:160px;"><canvas id="pos-history-chart-${posKey}"></canvas></div>

          <div class="pos-history-subheader">Pool Volume (USD)</div>
          <div class="range-btns" id="pos-volume-btns-${posKey}">
            <button class="range-btn" onclick="setPositionVolumeRange('${p.chain}', '${p.protocol}', ${p.token_id}, '7d', this)">7D</button>
            <button class="range-btn active" onclick="setPositionVolumeRange('${p.chain}', '${p.protocol}', ${p.token_id}, '30d', this)">30D</button>
            <button class="range-btn" onclick="setPositionVolumeRange('${p.chain}', '${p.protocol}', ${p.token_id}, '60d', this)">60D</button>
            <button class="range-btn" onclick="setPositionVolumeRange('${p.chain}', '${p.protocol}', ${p.token_id}, '90d', this)">90D</button>
            <button class="range-btn" onclick="setPositionVolumeRange('${p.chain}', '${p.protocol}', ${p.token_id}, '180d', this)">180D</button>
          </div>
          <div class="history-chart-wrap" style="height:120px;"><canvas id="pos-volume-chart-${posKey}"></canvas></div>
        </div>
      </div>
    `;
  }).join('');
}

function showError(msg) {
  const el = document.getElementById('error-banner');
  if (!msg) { el.style.display = 'none'; return; }
  el.textContent = msg;
  el.style.display = 'block';
}

const positionPanelOpened = {};
const positionCurrentRange = {};
const positionVolumeCurrentRange = {};
const positionChartInstances = {};
const positionVolumeChartInstances = {};

function togglePositionHistory(chain, protocol, tokenId) {
  const posKey = `${chain}-${protocol}-${tokenId}`;
  const panel = document.getElementById(`pos-history-panel-${posKey}`);
  const arrow = document.getElementById(`pos-history-arrow-${posKey}`);
  const isOpen = panel.style.display !== 'none';
  if (isOpen) { panel.style.display = 'none'; arrow.textContent = '▸'; return; }
  panel.style.display = 'block';
  arrow.textContent = '▾';
  if (!positionPanelOpened[posKey]) {
    positionPanelOpened[posKey] = true;
    positionCurrentRange[posKey] = '30d';
    positionVolumeCurrentRange[posKey] = '30d';
    loadPositionHistory(chain, protocol, tokenId, '30d');
    loadPositionVolume(chain, protocol, tokenId, '30d');
  }
}

function setPositionHistoryRange(chain, protocol, tokenId, range, btnEl) {
  const posKey = `${chain}-${protocol}-${tokenId}`;
  positionCurrentRange[posKey] = range;
  btnEl.parentElement.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  loadPositionHistory(chain, protocol, tokenId, range);
}

function setPositionVolumeRange(chain, protocol, tokenId, range, btnEl) {
  const posKey = `${chain}-${protocol}-${tokenId}`;
  positionVolumeCurrentRange[posKey] = range;
  btnEl.parentElement.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  loadPositionVolume(chain, protocol, tokenId, range);
}

async function loadPositionHistory(chain, protocol, tokenId, range) {
  const posKey = `${chain}-${protocol}-${tokenId}`;
  const canvas = document.getElementById(`pos-history-chart-${posKey}`);
  try {
    const res = await fetch(`/api/history/${tokenId}?range=${range}&protocol=${protocol}&chain=${chain}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    renderPositionHistoryChart(posKey, canvas, data.snapshots || []);
  } catch (e) {
    if (positionChartInstances[posKey]) { positionChartInstances[posKey].destroy(); positionChartInstances[posKey] = null; }
    canvas.style.display = 'none';
    const wrap = canvas.parentElement;
    let msg = wrap.querySelector('.history-empty');
    if (!msg) { msg = document.createElement('div'); msg.className = 'history-empty'; wrap.appendChild(msg); }
    msg.textContent = 'History unavailable: ' + e.message;
  }
}

function renderPositionHistoryChart(tokenId, canvas, snapshots) {
  const wrap = canvas.parentElement;
  const existingMsg = wrap.querySelector('.history-empty');
  const withValue = snapshots.filter(s => s.value_usd !== undefined && s.value_usd !== null);

  if (!withValue.length) {
    const c = Chart.getChart(canvas); if (c) c.destroy();
    canvas.style.display = 'none';
    let msg = existingMsg;
    if (!msg) { msg = document.createElement('div'); msg.className = 'history-empty'; wrap.appendChild(msg); }
    msg.textContent = 'No history yet for this position in this range.';
    return;
  }
  if (existingMsg) existingMsg.remove();
  canvas.style.display = 'block';

  const labels = withValue.map(s => new Date(s.ts * 1000));
  const values = withValue.map(s => s.value_usd);

  const existingChart = Chart.getChart(canvas); if (existingChart) existingChart.destroy();
  positionChartInstances[tokenId] = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets: [{ label: 'Position Value (USD)', data: values, borderColor: '#4a9eff',
      backgroundColor: 'rgba(74,158,255,0.08)', fill: true, tension: 0.25, pointRadius: 0 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { type: 'time', time: { tooltipFormat: 'MMM d, HH:mm' }, ticks: { color: '#7a8899', font: { size: 9 } }, grid: { color: '#1d2330' } },
        y: { ticks: { color: '#7a8899', font: { size: 9 } }, grid: { color: '#1d2330' } },
      },
      plugins: { legend: { display: false } },
    },
  });
}

async function loadPositionVolume(chain, protocol, tokenId, range) {
  const posKey = `${chain}-${protocol}-${tokenId}`;
  const canvas = document.getElementById(`pos-volume-chart-${posKey}`);
  if (!canvas) return;
  try {
    const res = await fetch(`/api/pool-volume/${tokenId}?range=${range}&protocol=${protocol}&chain=${chain}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    renderPositionVolumeChart(posKey, canvas, data.candles || []);
  } catch (e) {
    if (positionVolumeChartInstances[posKey]) { positionVolumeChartInstances[posKey].destroy(); positionVolumeChartInstances[posKey] = null; }
    canvas.style.display = 'none';
    const wrap = canvas.parentElement;
    let msg = wrap.querySelector('.volume-empty');
    if (!msg) { msg = document.createElement('div'); msg.className = 'history-empty volume-empty'; wrap.appendChild(msg); }
    msg.textContent = 'Volume unavailable: ' + e.message;
  }
}

function renderPositionVolumeChart(tokenId, canvas, candles) {
  const wrap = canvas.parentElement;
  const existingMsg = wrap.querySelector('.volume-empty');
  if (!candles.length) {
    const cv = Chart.getChart(canvas); if (cv) cv.destroy();
    canvas.style.display = 'none';
    let msg = existingMsg;
    if (!msg) { msg = document.createElement('div'); msg.className = 'history-empty volume-empty'; wrap.appendChild(msg); }
    msg.textContent = 'No volume data available for this pool.';
    return;
  }
  if (existingMsg) existingMsg.remove();
  canvas.style.display = 'block';

  const labels = candles.map(c => new Date(c.ts * 1000));
  const values = candles.map(c => c.volume_usd);

  const existingVolumeChart = Chart.getChart(canvas); if (existingVolumeChart) existingVolumeChart.destroy();
  positionVolumeChartInstances[tokenId] = new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Pool Volume (USD)', data: values, backgroundColor: 'rgba(32,210,208,0.35)', borderColor: 'rgba(32,210,208,0.6)', borderWidth: 1 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { type: 'time', time: { unit: 'day', tooltipFormat: 'MMM d' }, ticks: { color: '#7a8899', font: { size: 9 } }, grid: { color: '#1d2330' } },
        y: { ticks: { color: '#7a8899', font: { size: 9 } }, grid: { color: '#1d2330' } },
      },
      plugins: { legend: { display: false } },
    },
  });
}

function restoreOpenPositionHistories(positions) {
  for (const p of positions) {
    const chain = p.chain;
    const protocol = p.protocol;
    const tokenId = p.token_id;
    const posKey = `${chain}-${protocol}-${tokenId}`;
    if (!positionPanelOpened[posKey]) continue;
    const panel = document.getElementById(`pos-history-panel-${posKey}`);
    const arrow = document.getElementById(`pos-history-arrow-${posKey}`);
    if (!panel) continue;
    panel.style.display = 'block';
    if (arrow) arrow.textContent = '▾';

    const range = positionCurrentRange[posKey] || '30d';
    const btnsContainer = document.getElementById(`pos-history-btns-${posKey}`);
    if (btnsContainer) {
      btnsContainer.querySelectorAll('.range-btn').forEach(b => {
        b.classList.toggle('active', b.textContent.trim().toLowerCase() === range.toLowerCase());
      });
    }
    loadPositionHistory(chain, protocol, tokenId, range);

    const volRange = positionVolumeCurrentRange[posKey] || '30d';
    const volBtnsContainer = document.getElementById(`pos-volume-btns-${posKey}`);
    if (volBtnsContainer) {
      volBtnsContainer.querySelectorAll('.range-btn').forEach(b => {
        b.classList.toggle('active', b.textContent.trim().toLowerCase() === volRange.toLowerCase());
      });
    }
    loadPositionVolume(chain, protocol, tokenId, volRange);
  }
}

async function loadPositions(bust) {
  const wallet = document.getElementById('wallet-input').value.trim();
  const url = `/api/positions${wallet ? '?wallet=' + wallet : ''}${wallet && bust ? '&bust=1' : (bust ? '?bust=1' : '')}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    showError(null);
    renderPortfolio(data.portfolio, data.sickle_addresses, data.note);
    renderPositions(data.positions || []);
    restoreOpenPositionHistories(data.positions || []);
  } catch (e) {
    showError(e.message);
    renderPortfolio(null);
    renderPositions([]);
  }
}

loadPositions(false);
setInterval(() => loadPositions(false), 90000);
</script>
